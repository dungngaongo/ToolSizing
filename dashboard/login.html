<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1>Admin Dashboard</h1>
                <p>Đăng nhập tài khoản quản trị</p>
            </div>
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Tên đăng nhập</label>
                    <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
                    <span class="field-error" id="error-username"></span>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="field-error" id="error-password"></span>
                </div>
                <button type="submit" class="btn-login" id="btn-login">
                    <span class="btn-text">Đăng nhập</span>
                    <span class="btn-loading" style="display:none"><i class="fas fa-spinner fa-spin"></i> Đang xử lý...</span>
                </button>
                <div id="login-error" class="login-error" style="display:none"></div>
            </form>
            <div class="login-footer">
                <p><i class="fas fa-info-circle"></i> Chỉ tài khoản admin2 mới được phép truy cập</p>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
