<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Sizing cấp phát - Viettel Family</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <section class="banner">
      <img alt="Viettel Top" width="2160" height="303" src="https://cdnvtfamily.keeng.vn/media/kt11/resize_detail_content_image_bbanner-1-1.jpg?v=1765242383">
    </section>

    <header class="header">
        <div class="container">
            <div class="logo-area">
                <p class="logo-vtf">Công nghệ hệ thống</p>
            </div>

            <nav class="nav-right">
                <a href="#" class="btn-viettel-group">Viettel Group</a>
                <a href="#">Xem theo đơn vị</a>
                <a href="#">Mới nhất</a>
                <span class="separator">|</span>
                <a href="#" class="login-link">Đăng nhập</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <aside class="sidebar">
            <ul class="side-menu">
                <li><a href="#" data-page="request"><i class="fa-solid fa-file-invoice"></i> Yêu cầu bài toán</a></li>
                <li><a href="#" data-page="input"><i class="fa-solid fa-file-import"></i> Thông tin đầu vào</a></li>
                <li><a href="#" data-page="model"><i class="fa-solid fa-sitemap"></i> Mô hình hệ thống</a></li>
                <li><a href="#" data-page="sizing"><i class="fa-solid fa-microchip"></i> Định cỡ hệ thống</a></li>
                <li><a href="#" data-page="summary"><i class="fa-solid fa-chart-line"></i> Tổng hợp và đề xuất</a></li>
            </ul>
        </aside>

        <section class="content" id="main-display">
            <h2 class="content-title">Chào mừng bạn!</h2>
            <p>Vui lòng chọn một mục ở menu bên trái để bắt đầu nhập liệu</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
