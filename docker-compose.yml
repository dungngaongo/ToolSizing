version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: sizing-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./Frontend:/usr/share/nginx/html/frontend
      - ./Dashboard:/usr/share/nginx/html/dashboard
    restart: always