server {
    listen 80;

    # -------------------------------------------------------
    # Frontend chính (User App): http://localhost:3000/
    # -------------------------------------------------------
    location / {
        root   /usr/share/nginx/html/frontend;
        index  login.html index.html;
        try_files $uri $uri/ =404;
    }

    # -------------------------------------------------------
    # Dashboard (Admin): http://localhost:3000/dashboard/
    # -------------------------------------------------------
    location /dashboard/ {
        alias  /usr/share/nginx/html/dashboard/;
        index  index.html;
        try_files $uri $uri/ =404;
    }
}
